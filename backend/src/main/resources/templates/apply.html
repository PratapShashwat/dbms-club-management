<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apply for Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var forms = document.querySelectorAll('form');
            var buttons = document.querySelectorAll('.btn:not([type="button"])');
            var spinner = document.getElementById('bottom-spinner');
            
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            forms.forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            buttons.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.tagName.toLowerCase() === 'a' || btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
            
            // Also show spinner when clicking links that aren't #
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    if (a.getAttribute('href') && !a.getAttribute('href').startsWith('#')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">Club Management System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Application Form: <span th:text="${club.name}" class="text-success"></span></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/apply/{id}(id=${club.clubId})}" method="POST">
                        <div class="mb-3">
                            <label for="rollNumber" class="form-label">Roll Number</label>
                            <input type="text" class="form-control" id="rollNumber" name="rollNumber" required placeholder="e.g. 24075074">
                        </div>
                        
                        <div class="mb-3">
                            <label for="verticalId" class="form-label">Select Vertical (Optional)</label>
                            <select class="form-select" id="verticalId" name="verticalId">
                                <option value="">-- No specific vertical --</option>
                                <option th:each="v : ${verticals}" th:value="${v.verticalId}" th:text="${v.name}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="academicYear" class="form-label">Academic Year</label>
                            <input type="text" class="form-control" id="academicYear" name="academicYear" value="2026-2027" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="statementOfPurpose" class="form-label">Statement of Purpose</label>
                            <textarea class="form-control" id="statementOfPurpose" name="statementOfPurpose" rows="4" required placeholder="Why do you want to join this club?"></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Submit Application</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
