<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff00 !important;
            color: #000 !important;
            padding: 10px 20px;
            border-radius: 50px !important;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
            z-index: 99999;
            display: flex; /* Visible by default while page loads */
            align-items: center;
            gap: 10px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            border: 3px solid #000 !important;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #000 !important;
            border-top-color: transparent !important;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // 1. Hide the spinner as soon as the page is fully loaded
        window.addEventListener("load", function() {
            var spinner = document.getElementById('bottom-spinner');
            if (spinner) spinner.style.display = 'none';
        });

        // 2. Show the spinner instantly on clicks/submits (no artificial delay)
        document.addEventListener("DOMContentLoaded", function() {
            var spinner = document.getElementById('bottom-spinner');
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    var href = a.getAttribute('href');
                    if (href && !href.startsWith('#') && !a.hasAttribute('download') && !a.hasAttribute('target')) {
                        showSpinner();
                    }
                });
            });
            
            document.querySelectorAll('.btn:not([type="button"]):not(a)').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
</head>


<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin">Admin Portal</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Student View</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Pending Membership Applications</h2>
    
    <div th:if="${param.approved}" class="alert alert-success">Application Approved Successfully!</div>
    <div th:if="${param.rejected}" class="alert alert-danger">Application Rejected.</div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm">
            <thead class="table-light">
                <tr>
                    <th>Form ID</th>
                    <th>Roll Number</th>
                    <th>Club</th>
                    <th>Vertical</th>
                    <th>Statement of Purpose</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="form : ${pendingForms}">
                    <td th:text="${form.formId}"></td>
                    <td th:text="${form.applicant.rollNumber}"></td>
                    <td th:text="${form.club.name}"></td>
                    <td th:text="${form.vertical != null ? form.vertical.name : 'N/A'}"></td>
                    <td th:text="${form.statementOfPurpose}"></td>
                    <td>
                        <form th:action="@{/admin/approve-membership/{id}(id=${form.formId})}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">Approve</button>
                        </form>
                        <form th:action="@{/admin/reject-membership/{id}(id=${form.formId})}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pendingForms.isEmpty()}">
                    <td colspan="6" class="text-center text-muted">No pending applications right now.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
