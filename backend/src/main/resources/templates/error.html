<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Error</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff00 !important;
            color: #000 !important;
            padding: 10px 20px;
            border-radius: 50px !important;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
            z-index: 99999;
            display: flex; /* Visible by default while page loads */
            align-items: center;
            gap: 10px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            border: 3px solid #000 !important;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #000 !important;
            border-top-color: transparent !important;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // 1. Hide the spinner as soon as the page is fully loaded
        window.addEventListener("load", function() {
            var spinner = document.getElementById('bottom-spinner');
            if (spinner) spinner.style.display = 'none';
        });

        // 2. Show the spinner instantly on clicks/submits (no artificial delay)
        document.addEventListener("DOMContentLoaded", function() {
            var spinner = document.getElementById('bottom-spinner');
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    var href = a.getAttribute('href');
                    if (href && !href.startsWith('#') && !a.hasAttribute('download') && !a.hasAttribute('target')) {
                        showSpinner();
                    }
                });
            });
            
            document.querySelectorAll('.btn:not([type="button"]):not(a)').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
</head>


<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-5 text-center" style="max-width: 500px;">
    <h1 class="text-danger mb-3">Oops!</h1>
    <h5 class="text-secondary mb-4">Something went wrong.</h5>
    <div class="alert alert-danger" th:text="${errorMessage}">Error details.</div>
    <a href="/" class="btn btn-success mt-3">Return to Dashboard</a>
</div>
</body></html>
