<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Error</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var forms = document.querySelectorAll('form');
            var buttons = document.querySelectorAll('.btn:not([type="button"])');
            var spinner = document.getElementById('bottom-spinner');
            
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            forms.forEach(function(form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    showSpinner();
                    setTimeout(() => form.submit(), 400); // Artificial delay to ensure visibility
                });
            });
            
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    let href = a.getAttribute('href');
                    if (href && !href.startsWith('#') && !a.hasAttribute('download')) {
                        e.preventDefault();
                        showSpinner();
                        setTimeout(() => window.location.href = href, 400); // Artificial delay
                    }
                });
            });
        });
    </script>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-5 text-center" style="max-width: 500px;">
    <h1 class="text-danger mb-3">Oops!</h1>
    <h5 class="text-secondary mb-4">Something went wrong.</h5>
    <div class="alert alert-danger" th:text="${errorMessage}">Error details.</div>
    <a href="/" class="btn btn-success mt-3">Return to Dashboard</a>
</div>
</body></html>
