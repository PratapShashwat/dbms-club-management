<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${form.title}">Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff00 !important;
            color: #000 !important;
            padding: 10px 20px;
            border-radius: 50px !important;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
            z-index: 99999;
            display: flex; /* Visible by default while page loads */
            align-items: center;
            gap: 10px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            border: 3px solid #000 !important;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #000 !important;
            border-top-color: transparent !important;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // 1. Hide the spinner as soon as the page is fully loaded
        window.addEventListener("load", function() {
            var spinner = document.getElementById('bottom-spinner');
            if (spinner) spinner.style.display = 'none';
        });

        // 2. Show the spinner instantly on clicks/submits (no artificial delay)
        document.addEventListener("DOMContentLoaded", function() {
            var spinner = document.getElementById('bottom-spinner');
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    var href = a.getAttribute('href');
                    if (href && !href.startsWith('#') && !a.hasAttribute('download') && !a.hasAttribute('target')) {
                        showSpinner();
                    }
                });
            });
            
            document.querySelectorAll('.btn:not([type="button"]):not(a)').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
</head>


<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-success text-white">
            <h3 th:text="${form.title}">Form Title</h3>
            <p class="mb-0" th:text="'Target: ' + ${form.targetAudience} + ' | Type: ' + ${form.formType}"></p>
        </div>
        <div class="card-body">
            
            <div th:if="${alreadySubmitted}" class="alert alert-success">
                You have already submitted this form!
                <a th:href="@{/club/{id}(id=${form.club.clubId})}" class="btn btn-sm btn-success ms-2">Back to Club</a>
            </div>

            <form th:unless="${alreadySubmitted}" th:action="@{/form/{id}/submit(id=${form.formId})}" method="POST">
                
                <div class="alert alert-info">
                    <strong>Questions:</strong> <br>
                    <code th:text="${form.questionsJson}"></code>
                </div>

                <div class="mb-3">
                    <label class="form-label">Write your answers below (as JSON or structured text)</label>
                    <textarea class="form-control" name="answersJson" rows="5" required placeholder='e.g. {"Why join?": "I love coding", "Experience": "None"}'></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">Submit Application</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
