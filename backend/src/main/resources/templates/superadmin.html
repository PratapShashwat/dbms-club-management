<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Super Admin Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="#">SuperAdmin Portal</a>
        <a class="nav-link text-white" href="/">Back to Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    
    <div th:if="${param.success}" class="alert alert-success">Action completed successfully!</div>

    <div class="row">
        <!-- Assign GenSec -->
        <div class="col-md-8 mx-auto mb-4">
            <div class="card shadow-sm h-100 border-danger">
                <div class="card-header bg-white"><h4 class="text-danger">Assign General Secretary</h4></div>
                <div class="card-body">
                    <p class="text-muted">SuperAdmin can only assign Council-level PORs (GenSecs). Everything else is managed by the GenSecs themselves.</p>
                    <form th:action="@{/superadmin/assign-gensec}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Student Roll Number</label>
                            <input type="text" class="form-control" name="rollNumber" required placeholder="e.g. 101">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Assign Council Role (GenSec/Jt. GenSec)</label>
                            <select class="form-select" name="roleId" required>
                                <option th:each="role : ${gensecRoles}" th:value="${role.roleId}" th:text="${role.council.name} + ' - ' + ${role.title}"></option>
                                <option th:if="${gensecRoles.isEmpty()}" value="" disabled>No GenSec roles available!</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Appoint General Secretary</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
