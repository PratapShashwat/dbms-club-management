<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Super Admin Console</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">

</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container"><a class="navbar-brand" href="#">SuperAdmin Portal</a><a class="nav-link text-white" href="/">Back to Dashboard</a></div>
</nav>
<div class="container mt-5">
    <!-- ERROR TOAST/BOX -->
    <div th:if="${param.error}" class="alert alert-danger fw-bold shadow-sm" th:text="${param.error}"></div>
    <div th:if="${param.success}" class="alert alert-success fw-bold shadow-sm" th:text="${param.success}"></div>
    
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm border-danger h-100">
                <div class="card-header bg-white"><h4 class="text-danger">Assign General Secretary</h4></div>
                <div class="card-body">
                    <p class="text-muted small">Student MUST already belong to a club in the Council.</p>
                    <form th:action="@{/admin/assign-gensec}" method="POST">
                        <div class="mb-3"><input type="text" class="form-control" name="rollNumber" required placeholder="Student Roll No"></div>
                        <div class="mb-3">
                            <select class="form-select" name="councilId" required>
                                <option th:each="c : ${councils}" th:value="${c.councilId}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Appoint General Secretary</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header"><h4 class="mb-0">Current General Secretaries</h4></div>
                <div class="card-body">
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="g : ${gensecs}">
                            <div><strong th:text="${g.student.name}"></strong> (<span th:text="${g.student.rollNumber}"></span>)<br><small th:text="${g.student.email} + ' | ' + ${g.student.phoneNumber}"></small><br><small th:text="${g.role.council.name} + ' - ' + ${g.club.name}"></small></div>
                            <form th:action="@{/admin/remove-gensec}" method="POST"><input type="hidden" name="membershipId" th:value="${g.membershipId}"><button type="submit" class="btn btn-sm btn-outline-danger">Demote</button></form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
                <!-- Manage PORs -->
        <div class="col-md-12 mb-4">
            <div class="card shadow-sm border-warning">
                <div class="card-header bg-white"><h4 class="text-warning mb-0">Manage POR Titles</h4></div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-5">
                            <h6 class="text-muted">Create New POR</h6>
                            <form th:action="@{/admin/create-por}" method="POST">
                                <div class="mb-2"><input type="text" class="form-control form-control-sm" name="title" required placeholder="POR Title (e.g. Treasurer)"></div>
                                <div class="mb-2">
                                    <select class="form-select form-select-sm" name="entityId" required>
                                        <option value="">-- Select Target --</option>
                                        <optgroup label="Councils">
                                            <option th:each="c : ${councils}" th:value="'council_' + ${c.councilId}" th:text="${c.name}"></option>
                                        </optgroup>
                                        <optgroup label="Clubs">
                                            <option th:each="cl : ${allClubs}" th:value="'club_' + ${cl.clubId}" th:text="${cl.name}"></option>
                                        </optgroup>
                                    </select>
                                </div>
                                <div class="form-check form-check-sm mb-1"><input class="form-check-input" type="checkbox" name="canEditMembers"><label class="form-check-label small">Can Edit Members</label></div>
                                <div class="form-check form-check-sm mb-1"><input class="form-check-input" type="checkbox" name="canEditPors"><label class="form-check-label small">Can Assign PORs</label></div>
                                <div class="form-check form-check-sm mb-1"><input class="form-check-input" type="checkbox" name="canFloatForms"><label class="form-check-label small">Can Create Forms</label></div>
                                
                                <button type="submit" class="btn btn-warning btn-sm w-100 fw-bold">Create POR</button>
                            </form>
                        </div>
                        <div class="col-md-7">
                            <h6 class="text-muted">Existing PORs</h6>
                            <div style="max-height: 250px; overflow-y: auto;">
                                <ul class="list-group">
                                    <li class="list-group-item d-flex justify-content-between align-items-center py-1" th:each="r : ${allRoles}">
                                        <div>
                                            <strong th:text="${r.title}"></strong>
                                            <span class="badge bg-secondary ms-2" th:if="${r.council != null}" th:text="'Council: ' + ${r.council.name}"></span>
                                            <span class="badge bg-info text-dark ms-1" th:if="${r.club != null}" th:text="'Club: ' + ${r.club.name}"></span>
                                            <div class="mt-1">
                                                <small class="text-muted" th:text="${r.permissionsJson}"></small>
                                            </div>
                                        </div>
                                        <form th:if="${r.title != 'GenSec'}" th:action="@{/admin/delete-por}" method="POST">
                                            <input type="hidden" name="roleId" th:value="${r.roleId}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white"><h5>System Operation Logs</h5></div>
                <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-sm table-hover">
                        <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead>
                        <tbody><tr th:each="l : ${logs}"><td th:text="${l.timestamp}"></td><td th:text="${l.actor}"></td><td th:text="${l.action}"></td><td th:text="${l.details}"></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div></body></html>
