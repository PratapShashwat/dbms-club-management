<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Club Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var forms = document.querySelectorAll('form');
            var buttons = document.querySelectorAll('.btn:not([type="button"])');
            var spinner = document.getElementById('bottom-spinner');
            
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            forms.forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            buttons.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.tagName.toLowerCase() === 'a' || btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
            
            // Also show spinner when clicking links that aren't #
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    if (a.getAttribute('href') && !a.getAttribute('href').startsWith('#')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4 text-success">Login</h3>
    
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <form th:action="@{/login}" method="POST">
        <div class="mb-3">
            <label for="rollNumber" class="form-label">Roll Number</label>
            <input type="text" class="form-control" id="rollNumber" name="rollNumber" required placeholder="e.g. 24075074 or 0 for Admin">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Password">
        </div>
        <button type="submit" class="btn btn-success w-100">Sign In</button>
    </form>
<a href="/register" class="btn btn-outline-secondary w-100 mt-2">Register Here</a>
</div>

</body>
</html>
