<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>My Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff00 !important;
            color: #000 !important;
            padding: 10px 20px;
            border-radius: 50px !important;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
            z-index: 99999;
            display: flex; /* Visible by default while page loads */
            align-items: center;
            gap: 10px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            border: 3px solid #000 !important;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #000 !important;
            border-top-color: transparent !important;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // 1. Hide the spinner as soon as the page is fully loaded
        window.addEventListener("load", function() {
            var spinner = document.getElementById('bottom-spinner');
            if (spinner) spinner.style.display = 'none';
        });

        // 2. Show the spinner instantly on clicks/submits (no artificial delay)
        document.addEventListener("DOMContentLoaded", function() {
            var spinner = document.getElementById('bottom-spinner');
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    var href = a.getAttribute('href');
                    if (href && !href.startsWith('#') && !a.hasAttribute('download') && !a.hasAttribute('target')) {
                        showSpinner();
                    }
                });
            });
            
            document.querySelectorAll('.btn:not([type="button"]):not(a)').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
</head>


<body class="bg-light">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand">My Profile</a><a class="nav-link text-white" href="/">Dashboard</a></div></nav>
<div class="container mt-4">
    <div th:if="${param.error}" class="alert alert-danger fw-bold shadow-sm" th:text="${param.error}"></div>
    <div th:if="${param.success}" class="alert alert-success fw-bold shadow-sm" th:text="${param.success}"></div>
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3><span th:text="${student.name}"></span> (<span th:text="${student.rollNumber}"></span>)</h3>
            <p><strong>Branch:</strong> <span th:text="${student.branch}"></span> | <strong>Year:</strong> <span th:text="${student.graduationYear}"></span></p>
        </div>
    </div>
    
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white"><h5>My Memberships & Resignations</h5></div>
        <div class="card-body">
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center" th:each="m : ${memberships}">
                    <div><strong th:text="${m.club.name}"></strong> <span class="badge bg-success" th:if="${m.role != null}" th:text="${m.role.title}"></span><span class="badge bg-secondary" th:if="${m.role == null}">Member</span></div>
                    <form th:action="@{/user/resign}" method="POST" th:if="${m.role == null or m.role.title != 'GenSec'}">
                        <input type="hidden" name="membershipId" th:value="${m.membershipId}">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="${m.role != null ? 'Resign POR' : 'Leave Club'}"></button>
                    </form>
                    <span class="text-danger small" th:if="${m.role != null and m.role.title == 'GenSec'}">SuperAdmin must demote GenSecs.</span>
                </li>
            </ul>
        </div>
    </div>
</div></body></html>
