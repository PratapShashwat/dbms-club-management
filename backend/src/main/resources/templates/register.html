<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var forms = document.querySelectorAll('form');
            var buttons = document.querySelectorAll('.btn:not([type="button"])');
            var spinner = document.getElementById('bottom-spinner');
            
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            forms.forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            buttons.forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.tagName.toLowerCase() === 'a' || btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
            
            // Also show spinner when clicking links that aren't #
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    if (a.getAttribute('href') && !a.getAttribute('href').startsWith('#')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4 text-success">Student Registration</h3>
    <form th:action="@{/register}" method="POST">
        <input type="text" class="form-control mb-2" name="rollNumber" placeholder="Roll Number" required>
<input type="password" class="form-control mb-2" name="password" placeholder="Password (Optional, defaults to Roll No)">
        <input type="text" class="form-control mb-2" name="name" placeholder="Full Name" required>
        <input type="email" class="form-control mb-2" name="email" placeholder="Email" required>
        <input type="text" class="form-control mb-2" name="phoneNumber" placeholder="Phone Number">
        <select class="form-select mb-2" name="branch" required><option th:each="b : ${branches}" th:value="${b}" th:text="${b}"></option></select>
        <input type="text" class="form-control mb-2" name="course" placeholder="Course (e.g. B.Tech)">
        <input type="number" class="form-control mb-3" name="graduationYear" placeholder="Graduation Year (e.g. 2026)">
        <button type="submit" class="btn btn-success w-100 mb-2">Register</button>
        <a href="/login" class="btn btn-outline-secondary w-100">Back to Login</a>
    </form>
</div></body></html>
