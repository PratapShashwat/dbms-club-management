<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Submissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 99999;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        #bottom-spinner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff00 !important;
            color: #000 !important;
            padding: 10px 20px;
            border-radius: 50px !important;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
            z-index: 99999;
            display: flex; /* Visible by default while page loads */
            align-items: center;
            gap: 10px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            border: 3px solid #000 !important;
        }
        .spin-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #000 !important;
            border-top-color: transparent !important;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // 1. Hide the spinner as soon as the page is fully loaded
        window.addEventListener("load", function() {
            var spinner = document.getElementById('bottom-spinner');
            if (spinner) spinner.style.display = 'none';
        });

        // 2. Show the spinner instantly on clicks/submits (no artificial delay)
        document.addEventListener("DOMContentLoaded", function() {
            var spinner = document.getElementById('bottom-spinner');
            function showSpinner() {
                if(spinner) spinner.style.display = 'flex';
            }
            
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', showSpinner);
            });
            
            document.querySelectorAll('a').forEach(function(a) {
                a.addEventListener('click', function(e) {
                    var href = a.getAttribute('href');
                    if (href && !href.startsWith('#') && !a.hasAttribute('download') && !a.hasAttribute('target')) {
                        showSpinner();
                    }
                });
            });
            
            document.querySelectorAll('.btn:not([type="button"]):not(a)').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    if (btn.closest('form')) {
                        showSpinner();
                    }
                });
            });
        });
    </script>
</head>


<body class="bg-light">

<div class="container mt-5">
    <a th:href="@{/club/{id}(id=${form.club.clubId})}" class="btn btn-secondary mb-3">&larr; Back to Club</a>
    
    <h3 class="mb-4">Pending Form Submissions</h3>
    
    <div class="alert alert-info" th:if="${pendingForms.isEmpty()}">No pending submissions right now!</div>

    <div class="card shadow-sm mb-3" th:each="sub : ${pendingForms}">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="card-title text-success" th:text="${sub.student.name} + ' - ' + ${sub.dynamicForm.title}"></h5>
                <p class="mb-0 text-muted">Answers: <span th:text="${sub.answersJson}"></span></p>
            </div>
            <div>
                <form th:action="@{/form/approve/{id}(id=${sub.submissionId})}" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-success">Approve</button>
                </form>
                <form th:action="@{/form/reject/{id}(id=${sub.submissionId})}" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-danger">Reject</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
