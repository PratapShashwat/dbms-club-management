spring.application.name=club-management

# Server Port
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://mysql-2675b670-shashwatpsingh06-53ab.b.aivencloud.com:22017/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
# Using 'validate' because our database schema is already set up and we want Hibernate to just check it.
# DO NOT set to 'update' or 'create' as that might mess with our carefully constructed schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevent Spring from converting table names to lowercase
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
